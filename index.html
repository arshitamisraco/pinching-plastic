<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>pinching plastic</title>
<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden; width:100%; height:100%; }
  canvas { display:block; position:fixed; inset:0; width:100vw; height:100vh; touch-action:none; }
  #status {
    position:fixed; left:10px; bottom:10px; z-index:10;
    font:12px/1.4 monospace; color:#9f9; background:rgba(0,0,0,0.4);
    padding:4px 8px; border-radius:4px; pointer-events:none;
    max-width:60vw;
  }
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<video id="video" autoplay muted playsinline style="display:none"></video>
<div id="status">loading...</div>

<script>
// hand.js — webcam + hand-pinch tracking for the "pinching plastic" toy.
// Plain script, no imports/exports. Exposes window.PinchTracker.
(function () {
  'use strict';

  var params = {
    grab: 0.28,
    release: 0.45,
    smooth: 0.5,
    stiffness: 120,
    damping: 10,
    grabAmount: 0.15,
    depthGain: 1.6
  };

  // pulls.get(id) -> {
  //   anchor:[x,y], current:[x,y], pull:[x,y], vel:[x,y], strain, held
  // }
  var pulls = new Map();

  var status = 'idle';

  var video = null;
  var handLandmarker = null;
  var lastVideoTime = -1;
  var rafId = null;

  // smoothed uv points per hand slot (0/1), for exponential smoothing.
  var smoothedHand = [null, null];
  // smoothed hand-size proxy per hand slot (0/1), for depth (z) estimation.
  var smoothedSize = [null, null];

  function vlen(v) { return Math.sqrt(v[0] * v[0] + v[1] * v[1]); }
  function vsub(a, b) { return [a[0] - b[0], a[1] - b[1]]; }
  function vadd(a, b) { return [a[0] + b[0], a[1] + b[1]]; }

  function lerp(a, b, t) { return a + (b - a) * t; }

  function dist(ax, ay, bx, by) {
    var dx = ax - bx, dy = ay - by;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function grab(id, uv, size) {
    var existing = pulls.get(id);
    pulls.set(id, {
      anchor: [uv[0], uv[1]],
      current: [uv[0], uv[1]],
      pull: [0, 0],
      vel: existing ? existing.vel.slice() : [0, 0],
      strain: 0,
      grip: existing ? existing.grip : 0,
      gripVel: 0,
      // hand-size proxy at grab time, used to derive depth (z) from apparent
      // shrink/growth of the hand. Left null for the mouse fallback, which
      // drives depth directly via the wheel handler instead.
      size0: (typeof size === 'number') ? size : null,
      depth: 0,
      depthVel: 0,
      held: true
    });
  }

  function move(id, uv) {
    var e = pulls.get(id);
    if (!e || !e.held) return;
    e.current = [uv[0], uv[1]];
    e.pull = vsub(e.current, e.anchor);
    e.strain = vlen(e.pull);
  }

  // update depth (pull-away-from-camera) from the current smoothed hand size.
  // size shrinking relative to size0 (grab time) means the hand moved away.
  function updateDepth(id, size) {
    var e = pulls.get(id);
    if (!e || !e.held || e.size0 == null) return;
    var raw = params.depthGain * Math.log(e.size0 / size);
    raw = Math.max(-0.3, Math.min(2.0, raw));
    // extra smoothing on top of the already-smoothed size, since size jitters.
    e.depth = lerp(e.depth, raw, 0.4);
  }

  function release(id) {
    var e = pulls.get(id);
    if (!e) return;
    e.held = false;
    // pull/vel carry on into the spring; current stays anchor+pull.
  }

  // --- spring integration for released entries ---
  function stepSpring(e, dt) {
    // semi-implicit Euler on pull vector, spring to zero.
    var ax = -params.stiffness * e.pull[0] - params.damping * e.vel[0];
    var ay = -params.stiffness * e.pull[1] - params.damping * e.vel[1];
    e.vel[0] += ax * dt;
    e.vel[1] += ay * dt;
    e.pull[0] += e.vel[0] * dt;
    e.pull[1] += e.vel[1] * dt;
    e.current = vadd(e.anchor, e.pull);
    e.strain = vlen(e.pull);

    // spring grip back to zero with the same semi-implicit Euler dynamics,
    // so it wobbles instead of just decaying.
    var ag = -params.stiffness * e.grip - params.damping * e.gripVel;
    e.gripVel += ag * dt;
    e.grip += e.gripVel * dt;

    // spring depth (pull-away-from-camera) back to zero the same way.
    var ad = -params.stiffness * e.depth - params.damping * e.depthVel;
    e.depthVel += ad * dt;
    e.depth += e.depthVel * dt;
  }

  function integrate(dt) {
    pulls.forEach(function (e, id) {
      if (e.held) {
        // fast ramp to full grip (~0.25s), regardless of hand movement.
        e.grip += (1 - e.grip) * Math.min(1, dt * 10);
      } else {
        stepSpring(e, dt);
        var speed = vlen(e.vel);
        var gripSpeed = Math.abs(e.gripVel);
        if (vlen(e.pull) < 0.002 && speed < 0.002 && Math.abs(e.grip) < 0.01 && gripSpeed < 0.02 &&
            Math.abs(e.depth) < 0.01 && Math.abs(e.depthVel) < 0.02) {
          pulls.delete(id);
        }
      }
    });
  }

  // --- mouse / pointer fallback ---
  var MOUSE_ID = 'mouse';

  function attachMouse(canvasEl) {
    if (!canvasEl) return;
    var active = false;

    function uvFromEvent(ev) {
      var rect = canvasEl.getBoundingClientRect();
      var x = (ev.clientX - rect.left) / rect.width;
      var y = (ev.clientY - rect.top) / rect.height;
      return [x, y];
    }

    canvasEl.addEventListener('pointerdown', function (ev) {
      active = true;
      try { canvasEl.setPointerCapture(ev.pointerId); } catch (e) {}
      grab(MOUSE_ID, uvFromEvent(ev));
    });

    canvasEl.addEventListener('pointermove', function (ev) {
      if (!active) return;
      move(MOUSE_ID, uvFromEvent(ev));
    });

    function end() {
      if (!active) return;
      active = false;
      release(MOUSE_ID);
    }

    canvasEl.addEventListener('pointerup', end);
    canvasEl.addEventListener('pointercancel', end);
    canvasEl.addEventListener('pointerleave', end);

    // wheel while held simulates pulling the pinch away from the camera:
    // scroll up (negative deltaY) increases depth.
    canvasEl.addEventListener('wheel', function (ev) {
      if (!active) return;
      ev.preventDefault();
      var e = pulls.get(MOUSE_ID);
      if (!e || !e.held) return;
      e.depth = Math.max(0, Math.min(2.0, e.depth - ev.deltaY * 0.002));
    }, { passive: false });
  }

  // --- webcam ---
  function start(videoEl) {
    video = videoEl;
    status = 'loading camera';
    return new Promise(function (resolve, reject) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        status = 'no camera';
        reject(new Error('getUserMedia unsupported'));
        return;
      }
      navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'user',
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      }).then(function (stream) {
        video.srcObject = stream;
        video.playsInline = true;
        video.muted = true;

        function onReady() {
          if (video.videoWidth > 0 && video.videoHeight > 0) {
            video.removeEventListener('loadedmetadata', onReady);
            resolve();
            loadModel();
            loop();
          }
        }
        video.addEventListener('loadedmetadata', onReady);
        video.play().then(function () {
          onReady();
        }).catch(function () {
          // still may fire loadedmetadata later
        });
      }).catch(function (err) {
        status = 'no camera';
        reject(err);
      });
    });
  }

  function loadModel() {
    status = 'loading model';
    import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14')
      .then(function (vision) {
        var FilesetResolver = vision.FilesetResolver;
        var HandLandmarker = vision.HandLandmarker;
        return FilesetResolver.forVisionTasks(
          'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
        ).then(function (filesetResolver) {
          function create(delegate) {
            return HandLandmarker.createFromOptions(filesetResolver, {
              baseOptions: {
                modelAssetPath:
                  'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
                delegate: delegate
              },
              runningMode: 'VIDEO',
              numHands: 2
            });
          }
          return create('GPU').catch(function () {
            return create('CPU');
          });
        });
      }).then(function (landmarker) {
        handLandmarker = landmarker;
        status = 'ready';
      }).catch(function (err) {
        console.log('hand model failed to load, mouse fallback only', err);
        status = 'no model';
      });
  }

  function processResults(result) {
    var seenIds = [];
    if (result && result.landmarks) {
      for (var h = 0; h < result.landmarks.length; h++) {
        var lm = result.landmarks[h];
        var id = 'hand' + h;
        seenIds.push(id);

        var thumb = lm[4], index = lm[8], wrist = lm[0], midMcp = lm[9];
        var indexMcp = lm[5], pinkyMcp = lm[17];
        var handSize = dist(wrist.x, wrist.y, midMcp.x, midMcp.y) || 0.0001;
        var tipDist = dist(thumb.x, thumb.y, index.x, index.y);
        var ratio = tipDist / handSize;

        // hand-size proxy for depth: average of three inter-landmark
        // distances that all shrink/grow together as the hand moves away
        // from / toward the camera.
        var size = (
          dist(wrist.x, wrist.y, midMcp.x, midMcp.y) +
          dist(wrist.x, wrist.y, indexMcp.x, indexMcp.y) +
          dist(indexMcp.x, indexMcp.y, pinkyMcp.x, pinkyMcp.y)
        ) / 3;
        var smSize = smoothedSize[h];
        smSize = (smSize == null) ? size : lerp(smSize, size, params.smooth);
        smoothedSize[h] = smSize;

        // midpoint in UV, mirrored horizontally to match mirrored video.
        var midX = (thumb.x + index.x) / 2;
        var midY = (thumb.y + index.y) / 2;
        var uv = [1 - midX, midY];

        var sm = smoothedHand[h];
        if (!sm) {
          sm = uv.slice();
        } else {
          sm = [
            lerp(sm[0], uv[0], params.smooth),
            lerp(sm[1], uv[1], params.smooth)
          ];
        }
        smoothedHand[h] = sm;

        var entry = pulls.get(id);
        var isHeld = entry && entry.held;

        if (!isHeld && ratio < params.grab) {
          grab(id, sm, smSize);
        } else if (isHeld && ratio > params.release) {
          release(id);
        } else if (isHeld) {
          move(id, sm);
          updateDepth(id, smSize);
        }
      }
    }
    // release any hand entries no longer detected this frame.
    pulls.forEach(function (e, id) {
      if (id.indexOf('hand') === 0 && seenIds.indexOf(id) === -1 && e.held) {
        release(id);
      }
    });
    if (result && result.landmarks && result.landmarks.length < 2) {
      smoothedHand[1] = null;
      smoothedSize[1] = null;
    }
    if (!result || !result.landmarks || result.landmarks.length < 1) {
      smoothedHand[0] = null;
      smoothedSize[0] = null;
    }
  }

  function loop() {
    rafId = requestAnimationFrame(loop);
    if (!handLandmarker || !video) return;
    if (video.currentTime === lastVideoTime) return;
    lastVideoTime = video.currentTime;
    try {
      var result = handLandmarker.detectForVideo(video, performance.now());
      processResults(result);
    } catch (err) {
      console.log('detectForVideo failed', err);
    }
  }

  function update(dt) {
    integrate(dt);
  }

  function getPulls() {
    var out = [];
    pulls.forEach(function (e, id) {
      out.push({
        id: id,
        anchor: e.anchor.slice(),
        current: e.current.slice(),
        pull: e.pull.slice(),
        strain: e.grip * params.grabAmount + Math.max(e.depth, 0) + 0.6 * vlen(e.pull),
        grip: e.grip,
        depth: e.depth,
        held: e.held
      });
    });
    return out;
  }

  window.PinchTracker = {
    params: params,
    start: start,
    attachMouse: attachMouse,
    update: update,
    getPulls: getPulls,
    get status() { return status; },
    _process: processResults
  };
})();
</script>

<script type="module">
const statusEl = document.getElementById('status');
const canvas = document.getElementById('glcanvas');
const video = document.getElementById('video');
const gl = canvas.getContext('webgl2', { antialias: true, alpha: false });
if (!gl) {
  statusEl.textContent = 'WebGL2 not supported';
  throw new Error('no webgl2');
}

// ---------- shaders ----------
const VERT_SRC = `#version 300 es
out vec2 vUV;
void main() {
  vec2 pos = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(pos.x * 2.0 - 1.0, 1.0 - pos.y * 2.0, 0.0, 1.0);
  vUV = pos;
}`;

const FRAG_SRC = `#version 300 es
precision highp float;

in vec2 vUV;
out vec4 fragColor;

uniform sampler2D uTex;
uniform vec2 uRes;
uniform float uTime;
uniform int uCount;
uniform vec2 uAnchor[4];
uniform vec2 uPull[4];
uniform float uStrain[4];
uniform float uStrength;
uniform float uRadius;
uniform float uCreases;
uniform float uRainbow;
uniform vec2 uCoverScale;
uniform vec2 uCoverOffset;

// ---------- plastic film pinch: procedural gravity-well warp ----------
// No lighting model, no analytic height field: a soft, wide "suck-in"
// toward each pinch point (with a converging singularity at the exact tip),
// lobed into pleats, sheared into fold lines, textured with random thin
// spokes, sampled through a few chromatic taps for fringing. Everything is
// built from smooth exponentials/Gaussians so there is no hard mask and no
// hard boundary; the falloff itself is what keeps the surroundings clean.

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

float triWave(float x) {
  return abs(fract(x) - 0.5) * 4.0 - 1.0;
}

// one antialiased angular spoke set: nsp thin radial lines per turn, each
// present/absent and randomly lengthed per angular cell. The line itself is
// built from a true perpendicular distance (d * angular-offset-in-radians);
// dividing that by the known p-space size of one device pixel (1/uRes.y,
// since p's vertical span 0..1 covers uRes.y pixels) gives an honest
// screen-space pixel measure without fwidth(), which reliably triggers
// WebGL context loss on the swiftshader/ANGLE software path used here when
// called from inside this uniform-but-dynamic-trip-count loop.
float spokeSet(vec2 rel, float d, float R, float seed, float nsp) {
  const float TAU = 6.28318530718;
  float ang = atan(rel.y, rel.x);
  float cell = (ang / TAU) * nsp;
  float idx = floor(cell);
  float cellFrac = fract(cell) - 0.5;
  float jitter = (hash21(vec2(idx, seed + 1.0)) - 0.5) * 0.4;
  float angOff = (cellFrac - jitter) * (TAU / nsp);
  float distFromLine = d * angOff;
  float px = 1.0 / max(uRes.y, 1.0);
  float core = 1.0 - smoothstep(0.0, 1.5 * px, abs(distFromLine));
  float hLen = hash21(vec2(idx, seed + 5.0));
  float onOff = step(0.5, hash21(vec2(idx, seed + 9.0)));
  float len = R * mix(0.6, 2.6, hLen);
  float lengthMask = smoothstep(len, len * 0.15, d) * exp(-d / (len * 0.55 + 0.001));
  return core * onOff * lengthMask;
}

vec2 toVideoUV(vec2 samplePt) {
  float aspect = uRes.x / uRes.y;
  vec2 sUV = samplePt / vec2(aspect, 1.0);
  vec2 vv = sUV * uCoverScale + uCoverOffset;
  vv.x = 1.0 - vv.x;
  return clamp(vv, 0.001, 0.999);
}

const vec3 SPEC0 = vec3(1.0, 0.0, 0.0);
const vec3 SPEC1 = vec3(1.0, 0.5, 0.0);
const vec3 SPEC2 = vec3(1.0, 1.0, 0.0);
const vec3 SPEC3 = vec3(0.0, 1.0, 0.3);
const vec3 SPEC4 = vec3(0.0, 0.6, 1.0);
const vec3 SPEC5 = vec3(0.3, 0.0, 1.0);
const vec3 SPEC6 = vec3(0.6, 0.0, 1.0);

void main() {
  vec2 uv = vUV;
  float aspect = uRes.x / uRes.y;
  vec2 p = uv * vec2(aspect, 1.0);
  const float TAU = 6.28318530718;

  vec2 totalDisp = vec2(0.0);
  float spokeAcc = 0.0;
  float glowAcc = 0.0;
  float sheenAcc = 0.0;

  // dominant (strongest-influence) pull at this pixel, used for the
  // chroma-spread formula below.
  float bestW = -1.0;
  float domU = 0.0;
  float domP = 0.0;
  float domS = 0.0;
  vec2 domRd = vec2(1.0, 0.0);

  for (int i = 0; i < 4; i++) {
    if (i >= uCount) break;
    float s = uStrain[i];
    if (s < 0.0002) continue;

    vec2 c = (uAnchor[i] + uPull[i]) * vec2(aspect, 1.0);
    vec2 rel = p - c;
    float d = length(rel);
    vec2 rd = rel / max(d, 1e-4);
    float ang = atan(rel.y, rel.x);
    float ss = smoothstep(0.0, 1.8, s);
    float R = uRadius * (0.6 + 0.7 * ss);
    float u = d / max(R, 1e-4);

    // wide soft gravity well; g(0) = 0.5 (not 0) so the exact tip samples
    // from a ring around it rather than its own point, which is what makes
    // the streaks converge to (not vanish at) the pinch.
    float g = exp(-1.4 * u * u) * (0.5 + u);
    float k = min(s * 0.9, 1.2);
    float pullIn = k * R * g;

    // lobed pleats: two harmonics of the crease count, phase kinked by slow
    // angular value-noise (plus a gentle time drift) so lobes aren't a
    // perfect mandala.
    float N = max(uCreases, 1.0);
    float ph = 2.5 * vnoise(vec2(ang * 1.5, u * 0.8) + float(i) * 7.0) + 0.15 * uTime;
    float P = sin(N * ang + ph) + 0.5 * sin(2.0 * N * ang + 1.7 * ph);
    pullIn *= (1.0 + 0.35 * P);

    // fold shear: a triangle wave tangential nudge, only near the tip
    // (exp(-u*u)), that reads as the thin crease lines between lobes.
    vec2 tang = vec2(-rd.y, rd.x);
    float shear = 0.05 * R * min(s, 1.5) * exp(-u * u) * triWave(N * ang / TAU + ph * 0.1);

    vec2 disp = rd * pullIn + tang * shear;
    // directional drag: grabbed content follows the hand.
    disp -= uPull[i] * vec2(aspect, 1.0) * uStrength * 0.6 * exp(-u * u);
    disp *= uStrength;

    totalDisp += disp;

    // random thin radial spokes, two angular densities layered together.
    float seed = float(i) * 41.17;
    float sp = spokeSet(rel, d, R, seed, 72.0) + 0.6 * spokeSet(rel, d, R * 0.75, seed + 71.0, 48.0);
    spokeAcc += sp * 0.55 * min(s, 1.5);

    // small center glow right at the tip.
    float gsig = max(0.04 * R, 1e-4);
    glowAcc += exp(-(d * d) / (2.0 * gsig * gsig)) * 0.2 * min(s, 1.2);

    // slight sheen on the lit side of each pleat.
    sheenAcc += 0.05 * min(s, 1.2) * exp(-u * u) * max(P, 0.0);

    float w = s * g;
    if (w > bestW) { bestW = w; domU = u; domP = P; domRd = rd; domS = s; }
  }

  vec2 sampleP = p + totalDisp;

  vec2 dirD = domRd;
  float dl = length(totalDisp);
  if (dl > 1e-5) dirD = totalDisp / dl;

  // ---------- chromatic fringes: 7 taps along the local displacement ----------
  // spread is driven by the dominant pull's u/P so fringing shows up right
  // at the lobe/fold edges (where |P| and the near-tip falloff are both
  // high) instead of as flat concentric rings.
  float spread = uRainbow * min(domS, 1.5) * 0.035 * exp(-1.2 * domU * domU) * (0.35 + 0.65 * abs(domP));

  vec3 colAcc = vec3(0.0);
  vec3 wAcc = vec3(0.0);
  vec2 uvk;
  float f;

  f = -1.0;      uvk = toVideoUV(sampleP + dirD * spread * f); colAcc += texture(uTex, uvk).rgb * SPEC0; wAcc += SPEC0;
  f = -0.66667;  uvk = toVideoUV(sampleP + dirD * spread * f); colAcc += texture(uTex, uvk).rgb * SPEC1; wAcc += SPEC1;
  f = -0.33333;  uvk = toVideoUV(sampleP + dirD * spread * f); colAcc += texture(uTex, uvk).rgb * SPEC2; wAcc += SPEC2;
  f =  0.0;      uvk = toVideoUV(sampleP + dirD * spread * f); colAcc += texture(uTex, uvk).rgb * SPEC3; wAcc += SPEC3;
  f =  0.33333;  uvk = toVideoUV(sampleP + dirD * spread * f); colAcc += texture(uTex, uvk).rgb * SPEC4; wAcc += SPEC4;
  f =  0.66667;  uvk = toVideoUV(sampleP + dirD * spread * f); colAcc += texture(uTex, uvk).rgb * SPEC5; wAcc += SPEC5;
  f =  1.0;      uvk = toVideoUV(sampleP + dirD * spread * f); colAcc += texture(uTex, uvk).rgb * SPEC6; wAcc += SPEC6;

  vec3 color = colAcc / max(wAcc, vec3(0.0001));

  color += vec3(1.0) * spokeAcc;
  color += vec3(1.0) * glowAcc;
  color += vec3(1.0) * sheenAcc;

  fragColor = vec4(clamp(color, 0.0, 1.0), 1.0);
}`;

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    console.error('shader compile error:', gl.getShaderInfoLog(sh));
    throw new Error('shader compile failed');
  }
  return sh;
}

const vs = compile(gl.VERTEX_SHADER, VERT_SRC);
const fs = compile(gl.FRAGMENT_SHADER, FRAG_SRC);
const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
  console.error('program link error:', gl.getProgramInfoLog(program));
  throw new Error('program link failed');
}
gl.useProgram(program);

const U = {};
['uTex','uRes','uTime','uCount','uStrength','uRadius','uCreases','uRainbow','uCoverScale','uCoverOffset']
  .forEach(n => U[n] = gl.getUniformLocation(program, n));
U.uAnchor = gl.getUniformLocation(program, 'uAnchor');
U.uPull = gl.getUniformLocation(program, 'uPull');
U.uStrain = gl.getUniformLocation(program, 'uStrain');

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);

// ---------- texture (video or fallback) ----------
const tex = gl.createTexture();
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
// placeholder 1x1 so texture is complete before first upload
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([20,20,30,255]));

let useVideo = false;
const fallback = document.createElement('canvas');
fallback.width = 512; fallback.height = 512;
const fctx = fallback.getContext('2d');

function drawFallback(t) {
  const w = fallback.width, h = fallback.height;
  const grad = fctx.createLinearGradient(0, 0, w, h);
  const hue = (t * 20) % 360;
  grad.addColorStop(0, `hsl(${hue},70%,55%)`);
  grad.addColorStop(0.5, `hsl(${(hue+90)%360},70%,45%)`);
  grad.addColorStop(1, `hsl(${(hue+200)%360},70%,55%)`);
  fctx.fillStyle = grad;
  fctx.fillRect(0, 0, w, h);
  fctx.strokeStyle = 'rgba(255,255,255,0.35)';
  fctx.lineWidth = 2;
  const step = 32;
  for (let x = 0; x <= w; x += step) {
    fctx.beginPath(); fctx.moveTo(x, 0); fctx.lineTo(x, h); fctx.stroke();
  }
  for (let y = 0; y <= h; y += step) {
    fctx.beginPath(); fctx.moveTo(0, y); fctx.lineTo(w, y); fctx.stroke();
  }
  fctx.fillStyle = 'rgba(255,255,255,0.9)';
  fctx.font = 'bold 42px monospace';
  fctx.textAlign = 'center';
  fctx.fillText('PINCH & PULL', w/2, h/2 - 20);
  fctx.font = '20px monospace';
  fctx.fillText('no camera - fallback texture', w/2, h/2 + 20);
}

// ---------- gui / params ----------
const params = {
  strength: 1,
  radius: 0.28,
  creases: 16,
  rainbow: 1,
};

// GUI is loaded from CDN and must never block the render loop if it fails.
import('https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.esm.min.js')
  .then(({ default: GUI }) => {
    const gui = new GUI({ title: 'plastic wrap' });
    gui.domElement.style.position = 'fixed';
    gui.domElement.style.top = '8px';
    gui.domElement.style.right = '8px';
    gui.domElement.style.zIndex = 20;
    gui.add(params, 'strength', 0, 3, 0.01);
    gui.add(params, 'radius', 0.05, 0.6, 0.005);
    gui.add(params, 'creases', 0, 40, 1);
    gui.add(params, 'rainbow', 0, 3, 0.01);
    gui.add(window.PinchTracker.params, 'grabAmount', 0, 0.6, 0.01).name('grab');
    gui.add(window.PinchTracker.params, 'depthGain', 0, 4, 0.05).name('depth');
    const springFolder = gui.addFolder('springiness');
    springFolder.add(window.PinchTracker.params, 'stiffness', 20, 400, 1);
    springFolder.add(window.PinchTracker.params, 'damping', 1, 30, 0.5);
  })
  .catch(err => console.warn('lil-gui failed to load, continuing without GUI:', err));

// ---------- resize ----------
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.floor(window.innerWidth * dpr));
  const h = Math.max(1, Math.floor(window.innerHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
}
window.addEventListener('resize', resize);
resize();

// ---------- start tracker ----------
window.PinchTracker.attachMouse(canvas);

async function tryStartCamera() {
  try {
    await window.PinchTracker.start(video);
    useVideo = true;
  } catch (err) {
    useVideo = false;
    console.warn('PinchTracker.start failed, using fallback texture:', err && err.message);
  }
}
tryStartCamera();

// ---------- cover-fit ----------
function computeCover(srcW, srcH) {
  const canvasAspect = canvas.width / canvas.height;
  const srcAspect = srcW / srcH;
  let sx = 1, sy = 1;
  if (canvasAspect > srcAspect) {
    sy = srcAspect / canvasAspect;
  } else {
    sx = canvasAspect / srcAspect;
  }
  return [sx, sy, (1 - sx) * 0.5, (1 - sy) * 0.5];
}

// ---------- main loop ----------
const anchorArr = new Float32Array(8);
const pullArr = new Float32Array(8);
const strainArr = new Float32Array(4);
let last = performance.now();

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  window.PinchTracker.update(dt);
  const pulls = window.PinchTracker.getPulls().slice(0, 4);

  anchorArr.fill(0); pullArr.fill(0); strainArr.fill(0);
  pulls.forEach((p, i) => {
    anchorArr[i*2] = p.anchor[0]; anchorArr[i*2+1] = p.anchor[1];
    pullArr[i*2] = p.pull[0]; pullArr[i*2+1] = p.pull[1];
    strainArr[i] = p.strain;
  });

  let cover;
  if (useVideo && video.readyState >= 2 && video.videoWidth > 0) {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
    cover = computeCover(video.videoWidth, video.videoHeight);
  } else {
    drawFallback(now / 1000);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, fallback);
    cover = computeCover(fallback.width, fallback.height);
  }

  gl.useProgram(program);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(U.uTex, 0);
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uTime, now / 1000);
  gl.uniform1i(U.uCount, pulls.length);
  gl.uniform2fv(U.uAnchor, anchorArr);
  gl.uniform2fv(U.uPull, pullArr);
  gl.uniform1fv(U.uStrain, strainArr);
  gl.uniform1f(U.uStrength, params.strength);
  gl.uniform1f(U.uRadius, params.radius);
  gl.uniform1f(U.uCreases, params.creases);
  gl.uniform1f(U.uRainbow, params.rainbow);
  gl.uniform2f(U.uCoverScale, cover[0], cover[1]);
  gl.uniform2f(U.uCoverOffset, cover[2], cover[3]);

  gl.bindVertexArray(vao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  const heldCount = pulls.filter(p => p.held).length;
  statusEl.textContent = `${window.PinchTracker.status} | pinch to grab, pull your hand away from the screen (mouse: drag, scroll = depth) | active:${heldCount}`;
}
requestAnimationFrame(frame);
</script>
</body>
</html>
